[package]
name = "movex-equities"
version = "0.1.0"
description = "Daily volatility markets on US stocks"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "movex_equities"

[features]
# Deliberately not in `default`. The mock oracle must be absent from any
# build that was not explicitly asked for it, so a production artefact
# cannot settle against a price an admin typed in.
#
#   anchor build --arch v0 -- --features dev-oracle
#   cargo test --features dev-oracle
default = []
dev-oracle = []
# Self-serve test-token faucet. Devnet only, for the same reason: a
# production build must have no instruction that can mint the quote asset.
devnet-faucet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# init-if-needed: a first deposit creates the Position account, later ones
# reuse it. The handler distinguishes the two by a zeroed owner.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
pyth-solana-receiver-sdk = "2.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
